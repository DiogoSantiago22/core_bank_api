services:
  db:
    image: postgres:16
    container_name: bank_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: core_bank
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d core_bank"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: bank_api
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/core_bank
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET}